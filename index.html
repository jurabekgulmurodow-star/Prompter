<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter</title>
<style>
:root{--bg:#fafaf7;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--bd:#dcdcd5;--ac:#c2410c;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#f1f1ec;--mut:#a0a09a;--card:#1f1f1d;--bd:#3a3a36;--ac:#fb923c;--acfg:#1c1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--fg:#f1f1ec;--mut:#a0a09a;--card:#1f1f1d;--bd:#3a3a36;--ac:#fb923c;--acfg:#1c1c1a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:14px;gap:12px}
h1{font-size:18px;margin:0}
textarea{flex:1;min-height:120px;width:100%;resize:none;padding:12px;font-size:16px;line-height:1.5;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font-family:inherit}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px}
input[type=range]{width:100%;accent-color:var(--ac)}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;flex:1}
button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
button:disabled{opacity:.5}
#read{display:none;flex:1;min-height:0;flex-direction:column;gap:10px}
#wrap{flex:1;min-height:0;position:relative}
#stage{position:absolute;inset:0;overflow:hidden;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
#wrap video.vv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;border-radius:12px}
#wrap.vm #stage{background:transparent;border-color:transparent}
#wrap.vm #txt{color:#fff;text-shadow:0 1px 3px #000,0 0 10px #000;background:rgba(0,0,0,.3)}
#txt{padding:30vh 16px 60vh;line-height:1.6;white-space:pre-wrap;font-weight:500}
.bl{color:var(--ac);font-weight:700;letter-spacing:1px}
.w{cursor:pointer;-webkit-tap-highlight-color:transparent}
.w.sv{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2px}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ctx{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.4}
button.x{flex:0 0 auto;padding:4px 10px}
mark.hl{background:var(--ac);color:var(--acfg);padding:0 3px;border-radius:4px;font-weight:700}
#rec{font-size:13px;color:var(--ac);font-weight:600}
#res{display:none;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
audio{width:100%}
#msg{font-size:13px;color:var(--mut);white-space:pre-wrap}
</style>
</head>
<body>
<div id="app">
  <div id="setup" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow-y:auto">
    <h1>Teleprompter</h1>
    <textarea id="src" placeholder="Inglizcha matnni shu yerga kiriting…"></textarea>
    <div class="row">
      <label>Tezlik: <span id="spv">40</span><input id="sp" type="range" min="10" max="150" value="40"></label>
      <label>Harf o‘lchami: <span id="fsv">26</span><input id="fs" type="range" min="16" max="48" value="26"></label>
    </div>
    <div class="row">
      <label>Har nechta gapda: <span id="cnv">2</span><input id="cn" type="range" min="1" max="6" value="2"></label>
      <label>Nechta soʻz tushsin: <span id="cmv">1</span><input id="cm" type="range" min="1" max="5" value="1"></label>
    </div>
    <input type="file" id="vf" accept="video/*" style="display:none">
    <button id="vpick" style="flex:0 0 auto">Video tanlash (ixtiyoriy)</button>
    <video id="vid" playsinline preload="auto" controls style="display:none;width:100%;max-height:35vh;border-radius:12px;background:#000"></video>
    <div id="vrow" style="display:none;flex-direction:column;gap:8px">
      <div class="row"><label>Video ovozi: <span id="vlv">100</span><input id="vl" type="range" min="0" max="100" value="100"></label><button id="vclr" style="flex:0 0 auto">Videoni olib tashlash</button></div>
      <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg);flex:none"><input type="checkbox" id="vfit" checked> Matn tezligi video uzunligiga moslansin</label>
    </div>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg);flex:none"><input type="checkbox" id="blk" checked> So‘z tushib qolsin</label>
    <button class="p" id="start">Boshlash va yozish</button>
    <button id="diag" style="flex:0 0 auto">Mikrofon diagnostikasi</button>
    <pre id="dg" style="display:none;white-space:pre-wrap;font-size:12px;margin:0;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg)"></pre>
    <div id="bk" style="display:none;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)">
      <div style="font-weight:600">Savat (<span id="bkn">0</span>)</div>
      <div id="bkl"></div>
      <div class="row"><button id="bksh">Ulashish / nusxalash</button><button id="bkclr">Tozalash</button></div>
      <div id="bkm" style="font-size:13px;color:var(--mut)"></div>
    </div>
    <div id="fvbox" style="display:none;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)"><div style="font-weight:600">Tayyor video</div><div id="fvst" style="font-size:13px;color:var(--mut)"></div><video id="fv" controls playsinline style="display:none;width:100%;border-radius:12px;background:#000"></video><button id="fvsh" style="display:none">Videoni ulashish</button></div>
    <div id="rv" style="display:none;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)"><div style="font-weight:600">Berkitilgan soʻlar</div><div id="rvt" style="line-height:1.6;white-space:pre-wrap"></div></div>
    <div id="res">
      <div style="font-weight:600">Oxirgi yozuv</div>
      <audio id="aud" controls></audio>
      <div class="row"><button id="share">Telegramga ulashish</button></div>
      <div id="msg"></div>
    </div>
  </div>
  <div id="read">
    <div id="rec">● Yozilmoqda…</div>
    <div id="wrap"><div id="stage"><div id="txt"></div></div></div>
    <div class="row">
      <label>Tezlik: <span id="spv2">40</span><input id="sp2" type="range" min="10" max="150" value="40"></label>
      <label id="vrow2" style="display:none">Video ovozi: <span id="vlv2">100</span><input id="vl2" type="range" min="0" max="100" value="100"></label>
    </div>
    <div class="row">
      <button id="pause">Pauza</button>
      <button class="p" id="stop">To‘xtatish</button>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let speed=40,paused=false,raf=0,last=0,acc=0,mr=null,chunks=[],stream=null,blob=null,mime='';

// ---- storage (last recording only) ----
function db(){return new Promise((res,rej)=>{try{const r=indexedDB.open('tp',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function put(k,v){try{const d=await db();d.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}}
async function get(k){try{const d=await db();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})}catch(e){return undefined}}

// ---- blanks: every 2 sentences, one random word ----
let SENTS=[],REVIEW='';
function makeBlanks(text){
  const N=Math.max(1,+$('cn').value||2),M=$('blk').checked?Math.max(1,+$('cm').value||1):0;
  SENTS=(text.replace(/\s+/g,' ').trim().match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g)||[]).map(s=>s.trim());
  let out='',rev='';
  for(let i=0;i<SENTS.length;i+=N){
    const grp=SENTS.slice(i,i+N),items=[];
    grp.forEach((s,k)=>{s.split(/(\s+)/).forEach(t=>items.push({t,s:i+k}));items.push({t:' ',s:i+k})});
    const cand=[];
    if(grp.length===N)items.forEach((it,j)=>{if(((it.t.match(/[A-Za-z']+/)||[''])[0]).length>=3)cand.push(j)});
    const picks=new Set();
    while(picks.size<Math.min(M,cand.length))picks.add(cand[Math.floor(Math.random()*cand.length)]);
    items.forEach((it,j)=>{
      let first=true;
      it.t.split(/([A-Za-z']+)/).forEach((p,x)=>{
        if(x%2===0){out+=esc(p);rev+=esc(p);return}
        const bl=picks.has(j)&&first;first=false;
        out+='<span class="w'+(bl?' bl':'')+'" data-s="'+it.s+'" data-w="'+esc(p)+'">'+(bl?'______':esc(p))+'</span>';
        rev+=bl?'<mark class="hl">'+esc(p)+'</mark>':esc(p);
      });
    });
  }
  REVIEW=rev;
  return out;
}
function makeBlanksV2(text){
  SENTS=(text.replace(/\s+/g,' ').trim().match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g)||[]).map(s=>s.trim());
  let out='';
  for(let i=0;i<SENTS.length;i+=2){
    const grp=SENTS.slice(i,i+2),items=[];
    grp.forEach((s,k)=>{s.split(/(\s+)/).forEach(t=>items.push({t,s:i+k}));items.push({t:' ',s:i+k})});
    const cand=[];
    if(grp.length===2)items.forEach((it,j)=>{if(((it.t.match(/[A-Za-z']+/)||[''])[0]).length>=3)cand.push(j)});
    const pick=cand.length?cand[Math.floor(Math.random()*cand.length)]:-1;
    out+=items.map((it,j)=>{
      let first=true;
      return it.t.split(/([A-Za-z']+)/).map((p,x)=>{
        if(x%2===0)return esc(p);
        const bl=j===pick&&first;first=false;
        return '<span class="w'+(bl?' bl':'')+'" data-s="'+it.s+'" data-w="'+esc(p)+'">'+(bl?'______':esc(p))+'</span>';
      }).join('');
    }).join('');
  }
  return out;
}
function makeBlanksOld(text){
  const sents=text.replace(/\s+/g,' ').trim().match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g)||[];
  let out='';
  for(let i=0;i<sents.length;i+=2){
    const pair=sents.slice(i,i+2);
    if(pair.length<2){out+=esc(pair.join(''));continue}
    const toks=pair.join('').split(/(\s+)/);
    const cand=[];
    toks.forEach((t,j)=>{const m=t.match(/[A-Za-z']+/);if(m&&m[0].length>=3)cand.push(j)});
    const pick=cand.length?cand[Math.floor(Math.random()*cand.length)]:-1;
    out+=toks.map((t,j)=>j===pick?esc(t).replace(/[A-Za-z']+/,'<span class="bl">______</span>'):esc(t)).join('');
  }
  return out;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ---- scroll loop ----
function tick(t){
  if(!last)last=t;
  const dt=(t-last)/1000;last=t;
  if(!paused){acc+=speed*dt;const st=$('stage');const whole=Math.floor(acc);if(whole){st.scrollTop+=whole;acc-=whole}}
  raf=requestAnimationFrame(tick);
}
function syncSp(v){speed=+v;$('sp').value=v;$('sp2').value=v;$('spv').textContent=v;$('spv2').textContent=v}
$('sp').oninput=e=>syncSp(e.target.value);
$('sp2').oninput=e=>syncSp(e.target.value);
$('fs').oninput=e=>{$('fsv').textContent=e.target.value};
function saveCfg(){put('cfg',{n:$('cn').value,m:$('cm').value,sp:$('sp').value,fs:$('fs').value})}
$('cn').oninput=e=>{$('cnv').textContent=e.target.value;saveCfg()};
$('cm').oninput=e=>{$('cmv').textContent=e.target.value;saveCfg()};

// ---- start / stop ----
$('start').onclick=async()=>{
  const text=$('src').value.trim();
  if(!text){alert('Avval matn kiriting.');return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    $('msg').textContent='Mikrofonga ruxsat berilmadi: '+(e.name||e);
    diag().then(t=>{$('msg').textContent+='\n\n'+t});
    $('res').style.display='flex';return;
  }
  const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
  mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  chunks=[];
  mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=finish;
  mr.start(1000);
  $('txt').innerHTML=makeBlanks(text);saveCfg();put('review',REVIEW);$('rv').style.display='none';
  $('txt').style.fontSize=$('fs').value+'px';
  $('setup').style.display='none';$('read').style.display='flex';
  $('stage').scrollTop=0;acc=0;last=0;paused=false;$('pause').textContent='Pauza';
  vmode=!!vurl;vol0=vid.volume;
  $('wrap').classList.toggle('vm',vmode);
  if(vmode){
    vid.controls=false;vid.className='vv';vid.style.cssText='';vid.currentTime=0;$('wrap').insertBefore(vid,$('stage'));
    if($('vfit').checked&&vid.duration>0){const d=$('txt').scrollHeight-$('stage').clientHeight;if(d>0)syncSp(Math.max(5,Math.round(d/vid.duration)))}
    $('vrow2').style.display='flex';
    vid.onended=()=>$('stop').click();
    vid.play().catch(()=>{});
  }else $('vrow2').style.display='none';
  raf=requestAnimationFrame(tick);
};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Davom etish':'Pauza';if(vmode){try{if(paused){vid.pause();mr.pause()}else{vid.play();mr.resume()}}catch(e){}}};
$('stop').onclick=()=>{vid.onended=null;if(vmode)vid.pause();cancelAnimationFrame(raf);if(mr&&mr.state!=='inactive')mr.stop()};

async function finish(){
  stream&&stream.getTracks().forEach(t=>t.stop());
  blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});
  await put('audio',blob);await put('text',$('src').value);if(vmode){showResult();mergeVideo();return}
  showResult();
}
function ext(){const t=blob.type;return t.includes('mp4')?'m4a':t.includes('ogg')?'ogg':'webm'}
function showResult(){
  $('read').style.display='none';$('setup').style.display='flex';
  $('res').style.display='flex';
  $('aud').src=URL.createObjectURL(blob);
  if(REVIEW){$('rvt').innerHTML=REVIEW;$('rv').style.display='flex'}
  if(vmode)restoreVid();
  $('msg').textContent='';
}
$('share').onclick=async()=>{
  if(!blob)return;
  const f=new File([blob],'recording.'+ext(),{type:blob.type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Recording'});return}
    $('msg').textContent='Bu brauzerda fayl ulashish ishlamadi. Audio pleyerdagi ⋮ menyusidan yuklab oling.';
  }catch(e){if(e.name!=='AbortError')$('msg').textContent='Ulashib bo‘lmadi: '+(e.message||e.name)}
};

// ---- video mode ----
const vid=$('vid');let vurl='',vmode=false,vol0=1,fblob=null;
function setVol(v){vid.volume=v/100;$('vl').value=v;$('vl2').value=v;$('vlv').textContent=v;$('vlv2').textContent=v}
$('vl').oninput=e=>setVol(e.target.value);
$('vl2').oninput=e=>setVol(e.target.value);
$('vpick').onclick=()=>$('vf').click();
$('vf').onchange=e=>{const f=e.target.files[0];if(!f)return;if(vurl)URL.revokeObjectURL(vurl);vurl=URL.createObjectURL(f);vid.src=vurl;vid.style.display='block';$('vrow').style.display='flex';setVol(100);$('vpick').textContent='Boshqa video tanlash'};
$('vclr').onclick=()=>{vid.pause();vid.removeAttribute('src');vid.load();vid.style.display='none';$('vrow').style.display='none';if(vurl)URL.revokeObjectURL(vurl);vurl='';$('vpick').textContent='Video tanlash (ixtiyoriy)'};
function restoreVid(){vid.className='';vid.controls=true;vid.style.cssText='display:block;width:100%;max-height:35vh;border-radius:12px;background:#000';$('setup').insertBefore(vid,$('src').nextSibling);$('wrap').classList.remove('vm');vid.currentTime=0}
async function mergeVideo(){
  const st=$('fvst');$('fvbox').style.display='flex';$('fv').style.display='none';$('fvsh').style.display='none';
  st.textContent='Ovoz videoga yopishtirilmoqda…';
  try{
    const v=document.createElement('video');v.src=vurl;v.playsInline=true;v.preload='auto';
    await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(new Error('video o‘qilmadi'))});
    const a=new Audio(URL.createObjectURL(blob));
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const dest=ctx.createMediaStreamDestination();
    const gv=ctx.createGain();gv.gain.value=vol0;
    ctx.createMediaElementSource(v).connect(gv);gv.connect(dest);
    ctx.createMediaElementSource(a).connect(dest);
    if(!v.captureStream)throw new Error('brauzer videoni qayta yozishni qo‘llamaydi');
    const vs=v.captureStream();
    const ms=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);
    const vt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const out=[];const rec=new MediaRecorder(ms,vt?{mimeType:vt}:undefined);
    rec.ondataavailable=e=>{if(e.data&&e.data.size)out.push(e.data)};
    const done=new Promise(r=>{rec.onstop=r});
    await ctx.resume();
    rec.start(1000);
    await Promise.all([v.play(),a.play()]);
    const tm=setInterval(()=>{st.textContent='Yopishtirilmoqda… '+Math.round(v.currentTime)+' / '+Math.round(v.duration)+' s'},500);
    await new Promise(r=>{v.onended=r});
    clearInterval(tm);
    rec.stop();await done;
    fblob=new Blob(out,{type:rec.mimeType||vt||'video/webm'});
    $('fv').src=URL.createObjectURL(fblob);$('fv').style.display='block';$('fvsh').style.display='block';
    st.textContent='Tayyor.';
  }catch(e){st.textContent='Yopishtirib bo‘lmadi: '+(e.message||e.name)}
}
$('fvsh').onclick=async()=>{
  if(!fblob)return;
  const f=new File([fblob],'video.'+(fblob.type.includes('mp4')?'mp4':'webm'),{type:fblob.type});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
    $('fvst').textContent='Ulashib bo‘lmadi. Videoning ⋮ menyusidan yuklab oling.';
  }catch(e){if(e.name!=='AbortError')$('fvst').textContent='Ulashib bo‘lmadi: '+(e.message||e.name)}
};

// ---- diagnostics ----
async function diag(){
  const L=[];
  let framed=false;try{framed=window.top!==window}catch(e){framed=true}
  L.push('Boshqa oyna ichida (iframe): '+(framed?'HA':'yo‘q'));
  L.push('Xavfsiz aloqa (https): '+(window.isSecureContext?'ha':'YO‘Q'));
  L.push('mediaDevices: '+(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?'bor':'YO‘Q'));
  L.push('MediaRecorder: '+(window.MediaRecorder?'bor':'YO‘Q'));
  try{const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature)L.push('Sahifa siyosati mikrofonga: '+(pp.allowsFeature('microphone')?'ruxsat':'BLOKLANGAN'))}catch(e){}
  try{const p=await navigator.permissions.query({name:'microphone'});L.push('Brauzer ruxsati: '+p.state)}catch(e){L.push('Brauzer ruxsati: aniqlab bo‘lmadi')}
  try{const d=await navigator.mediaDevices.enumerateDevices();L.push('Mikrofonlar soni: '+d.filter(x=>x.kind==='audioinput').length)}catch(e){}
  L.push('Brauzer: '+navigator.userAgent.slice(0,90));
  return L.join('\n');
}
$('diag').onclick=async()=>{const d=$('dg');d.style.display='block';d.textContent='Tekshirilmoqda…';d.textContent=await diag()};

// ---- basket: tapped words with their sentence ----
let basket=[],clrArm=false;
function renderBasket(){
  $('bkn').textContent=basket.length;
  $('bk').style.display=basket.length?'flex':'none';
  $('bkl').innerHTML=basket.map((b,i)=>'<div class="it"><div><b>'+esc(b.w)+'</b><div class="ctx">'+esc(b.t)+'</div></div><button class="x" data-i="'+i+'">✕</button></div>').join('');
}
$('txt').addEventListener('click',e=>{
  const el=e.target.closest('.w');if(!el)return;
  const w=el.dataset.w,t=SENTS[+el.dataset.s]||'';
  el.classList.add('sv');
  if(!basket.some(b=>b.w.toLowerCase()===w.toLowerCase()&&b.t===t)){basket.push({w,t});put('basket',basket);renderBasket()}
  try{navigator.vibrate&&navigator.vibrate(20)}catch(_){}
  const r=$('rec');r.textContent='✔ Saqlandi: '+w;clearTimeout(window._rt);window._rt=setTimeout(()=>{r.textContent='● Yozilmoqda…'},1500);
});
$('bkl').onclick=e=>{const x=e.target.closest('.x');if(!x)return;basket.splice(+x.dataset.i,1);put('basket',basket);renderBasket()};
$('bkclr').onclick=()=>{
  if(!clrArm){clrArm=true;$('bkclr').textContent='Aniqmi? Yana bosing';setTimeout(()=>{clrArm=false;$('bkclr').textContent='Tozalash'},3000);return}
  clrArm=false;$('bkclr').textContent='Tozalash';basket=[];put('basket',basket);renderBasket();
};
$('bksh').onclick=async()=>{
  const txt=basket.map(b=>b.w+' — '+b.t).join('\n\n');
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt);$('bkm').textContent='Nusxalandi'}catch(e){$('bkm').textContent='Nusxalab bo‘lmadi'}
};

// ---- restore last session ----
(async()=>{
  const t=await get('text');if(t)$('src').value=t;
  const bk=await get('basket');if(Array.isArray(bk)){basket=bk;renderBasket()}
  const rvw=await get('review');if(typeof rvw==='string')REVIEW=rvw;
  const cf=await get('cfg');if(cf){$('cn').value=cf.n;$('cm').value=cf.m;$('cnv').textContent=cf.n;$('cmv').textContent=cf.m;if(cf.sp)syncSp(cf.sp);if(cf.fs){$('fs').value=cf.fs;$('fsv').textContent=cf.fs}}
  const b=await get('audio');if(b&&b.size){blob=b;showResult()}
})();
</script>
